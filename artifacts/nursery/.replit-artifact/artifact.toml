kind = "web"
previewPath = "/"
title = "Agricultural Nursery Management System"
version = "1.0.0"
id = "artifacts/nursery"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23555
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/nursery run dev"

[services.env]
PORT = "23555"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/nursery", "run", "build"]
publicDir = "artifacts/nursery/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
